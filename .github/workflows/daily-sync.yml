name: Daily contest sync

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync.mjs'
      - '.github/workflows/daily-sync.yml'
  schedule:
    # Primary run at 07:32 IST, with hourly fallback attempts through 10:32 IST.
    # The guard below ensures only one successful sync per India calendar day.
    - cron: '2 2 * * *'
    - cron: '2 3 * * *'
    - cron: '2 4 * * *'
    - cron: '2 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contest-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, validate and publish contest data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Skip if already synced today (IST)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const contests = JSON.parse(await readFile('public/data/contests.json', 'utf8'));
          const istDate = value => new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(value);
          const syncedDate = contests.lastSynced ? istDate(new Date(contests.lastSynced)) : '';
          const today = istDate(new Date());
          const skip = syncedDate === today;
          console.log(skip
            ? `Already synced for ${today} IST; skipping this scheduled fallback.`
            : `Dataset is from ${syncedDate || 'an unknown date'}; syncing for ${today} IST.`);
          await import('node:fs/promises').then(({ appendFile }) =>
            appendFile(process.env.GITHUB_OUTPUT, `skip=${skip}\n`));
          NODE

      - name: Fetch contest archives
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/sync.mjs

      - name: Validate generated datasets
        if: steps.guard.outputs.skip != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const contests = JSON.parse(await readFile('public/data/contests.json', 'utf8'));
          const problems = JSON.parse(await readFile('public/data/problems.json', 'utf8'));
          if (!Array.isArray(contests.contests) || !Array.isArray(problems.problems)) throw new Error('Dataset arrays are missing');
          if (!contests.lastSynced || contests.lastSynced !== problems.lastSynced) throw new Error('Dataset timestamps do not match');
          if (contests.rangeStart !== '2026-08-01T00:00:00Z' || problems.rangeStart !== contests.rangeStart) throw new Error('Unexpected archive boundary');
          if (contests.sourceErrors?.length) throw new Error('One or more providers reported errors');
          for (const platform of ['Codeforces', 'CodeChef', 'LeetCode']) {
            if (!(contests.sourceCounts?.[platform] > 0)) throw new Error(`Missing contest data for ${platform}`);
          }
          if (problems.problems.length === 0) throw new Error('Problem index is empty');
          console.log('Validated', contests.contests.length, 'contests and', problems.problems.length, 'problems');
          console.log('Platform counts:', contests.sourceCounts);
          NODE

      - name: Commit only validated data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No dataset changes; nothing to publish."
            exit 0
          fi
          git commit -m "chore: daily contest archive sync"
          git push origin HEAD:main
